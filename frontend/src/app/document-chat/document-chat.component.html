<div class="chat-wrapper">
  <div class="chat-header">
    <mat-icon>smart_toy</mat-icon>
    <span>Ask about this document</span>
  </div>

  <div class="message-list" #messageList>
    @if (messages.length === 0) {
      <p class="placeholder">Ask a question about the document and I'll answer using only its content.</p>
    }

    @for (msg of messages; track $index) {
      @if (msg.role === 'typing') {
        <div class="message typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      } @else {
        <div class="message"
             [class.user]="msg.role === 'user'"
             [class.ai]="msg.role === 'assistant'"
             [class.error-msg]="msg.role === 'error'">
          {{ msg.content }}
        </div>
      }
    }
  </div>

  <div class="chat-input">
    <mat-form-field appearance="outline" class="input-field" subscriptSizing="dynamic">
      <input #chatInput
             matInput
             [(ngModel)]="inputValue"
             (keydown)="onKeydown($event)"
             [disabled]="isLoading"
             placeholder="Ask a question…"
             autocomplete="off" />
    </mat-form-field>
    <button mat-icon-button
            color="primary"
            (click)="send()"
            [disabled]="isLoading || !inputValue.trim()"
            aria-label="Send message">
      <mat-icon>send</mat-icon>
    </button>
  </div>
</div>
